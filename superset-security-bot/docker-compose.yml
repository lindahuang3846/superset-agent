services:
  webhook-server:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ${SUPERSET_REPO_PATH:-../superset}:/repo:ro
      - db-data:/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Daily scanner: runs at 9am UTC, scans the mounted Superset repo,
  # and creates GitHub issues for any new SQL injection findings.
  scanner:
    build: .
    env_file:
      - .env
    volumes:
      - ${SUPERSET_REPO_PATH:-../superset}:/repo:ro
      - db-data:/app
    entrypoint: >
      sh -c "
        echo '0 9 * * * cd /app && python -m app.scanner >> /var/log/scanner.log 2>&1'
        | crontab - && crond -f
      "
    restart: unless-stopped

volumes:
  db-data:
